<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <style>
        .con{
            height: 600px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .box{
            height: 80%;
            width: 80%;
            align-items: center;
            display: flex;
             box-shadow: 10px 10px 10px;
           border-radius: 20px;
        }
        .left,.center,.right{
            height: 100%;
           
        }
        .left{
            width: 3%;
            background-color: navy;
            border-radius: 20px;
        }
        .center{
            width: 62%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 58px;
            background-color: whitesmoke;
        }
        h1{
            margin-left: 20px;
            color: navy;
        }
            
        *{
            padding: 0%;
            margin: 0%;
            box-sizing: border-box;
        }
        .right{
            width: 35%;
            border-radius: 20px;
        }
        .top{
            height: 30%;
           
        }
        .topin{
            width: 100%;
            height: 90%;
            background-color: navy;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }
        .circle{
            height: 120px;
            width: 120px;
            border: 5px solid navy;
           border-radius: 50%;
           position: absolute;
           top: 85px;
           right: 270px;
           display: flex;
           align-items: center;
          justify-content: center;
        }
        img{
            height: 100%;
            width: 100%;
            border-radius: 50%;
            border: 5px solid white;
        }
        .bottom{
            height: 70%;
            
        }
        .right>h1{
        text-align: center;
        }
        .button{
            height: 20%;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            
        }
        .button1{
        height: 50%;
        width: 40%;
        background-color: navy;
        color: white;
        border-radius: 20px;
        text-align: center;
        line-height: 30px;
        }
        .bottom>h1{
        text-align: center;
        }
        .icon{
            height: 20%;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
        }
        .fa-facebook{
            color: blue;
        }
        .fa-instagram{
            background: linear-gradient(purple,red,yellow,orange);
            color: transparent;
            background-clip: text;
        }
        .fa-linkedin{
            color: blue;
        }
        .fa-behance{
            color: blue;
        }
        .fa-github{
            color: pink;
        }
        .fa-heart{
            color: red;
        }
        .fa-comment{
            color:rgb(rgb(54, 67, 213));
        }
        .fa-share{
            color: grey;
        }
    </style>
</head>
<body>
    <div class="con">
        <div class="box">
         <div class="left"></div>
         <div class="center">
            <h1> Profile Card UI UX Design </h1>
         </div>
         <div class="right">
            <div class="top">
                <div class="topin">
                    <div class="circle">
                        <img src="Capture.PNG" alt="">
                    </div>
                </div>
            </div>
            <div class="bottom">
                <h1>Website Developer</h1>
                <h1>Dezyne Ecole College</h1>
                <h1>BCA 1st Year</h1>
                <div class="icon">
                    <i class="fa fa-brands fa-facebook fa-2x"></i>
                    <i class="fa fa-brands fa-instagram fa-2x"></i>
                    <div class="fa fa-brands fa-linkedin fa-2x"></div>
                    <i class="fa fa-brands fa-github fa-2x"></i>
                    <i class="fa fa-brands fa-behance fa-2x"></i>
                </div>
                <div class="button">
                <div class="button1">Subscribe</div>
                <div class="button1">Message</div>
                </div>
               <div class="icon">
                    <i class="fa fa-solid fa-heart fa-2x"></i>60.4k
                    <i class="fa fa-solid fa-comment fa-2x"></i>20k
                    <div class="fa fa-solid fa-share fa-2x"></div>12.6k
                    
                </div>
            </div>
            </div>
            
         </div>
        </div>
    </div>
    
</body>
</html>
