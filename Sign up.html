<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0%;
            padding: 0%;
            box-sizing: border-box;
        }
        body{
            height: 100vh;
            background: linear-gradient(90deg,skyblue,purple);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        form{
            height: 80%;
            width: 30%;
            background-color: white;
            border-radius: 10px;
        }
        .basic,.email,.password,.button{
            width: 90%;
            margin: auto;
            margin-top: 3%;
        }
        input{
            margin-top: 3%;
        }
        button{
            width: 100%;
            background: linear-gradient(90deg,skyblue,purple);
            height: 40%;
            color: white;
            border: none;
        }
        .button{
            height: 20%;
        }
        .button>p{
            text-align: center;
        }
        p{
            margin-top: 3%;
        }
    </style>
</head>
<body>
    <form action="">
        <h1 align="center">Sign Up</h1>
        <div class="basic">
            <label for="">First Name:</label>
            <input type="text"><br>
            <label for="">Last Name:</label>
            <input type="text"><br>
            <label for="">Gender</label>
            <input type="radio" name="Gender" id="">Male 
            <input type="radio" name="Gender" id="">Female <br>
            <label for="">Date of Birth</label>
            <input type="date" name="" id=""><br>
            <label for="">Mobile No.</label>
            <input type="tel" name="" id=""><br>
        </div>
        <div class="email">
            <label for="">Email</label>
            <input type="email" name="" id=""><br>
            <label for="">Confirm Email</label>
            <input type="email" name="" id=""><br>
        </div>
        <div class="password">
            <label for="">Password</label>
            <input type="password" name="" id=""><br>
            <label for="">Confirm Password</label>
            <input type="password" name="" id=""><br>
        </div>
        <div class="button">
            <input type="checkbox" name="" id="">Terms And Conditions <br>
            <button>Sign Up</button>
            <p>Already a Member ? <a href="Assignment 10.html">Log In</a></p>
        </div>
    </form>
</body>
</html>
