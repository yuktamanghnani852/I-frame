<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .con{
        height: 600px;
        border: 1px solid black;
    }
    .header,.footer{
        height: 20%;
        background-color: teal;
    }
    .center{
        height: 60%;
        background-color: beige;
        display: flex;
    }
    .left{
        height: 100%;
        background-color: orange;
        width: 20%;
    }
    .right{
        height: 100%;
        background-color: orangered;
        width: 80%;
    }
    .top{
        height: 50%;
        background-color: brown;
    }
    .bottom{
        height: 50%;
        background-color: red;
        display: flex;
    }
    .bottom1{
        height: 100%;
        width: 50%;
        background-color: chocolate ;
    }
    .bottom2{
        height: 100%;
        width: 50%;
        background-color: goldenrod ;
    }

</style>
<body>
    <h1 align="center">Flex Box</h1>
    <div class="con">
        <div class="header"></div>
        <div class="center">
            <div class="left"></div>
            <div class="right">
                <div class="top"></div>
                <div class="bottom">
                    <div class="bottom1"></div>
                    <div class="bottom2"></div>
                </div>
            </div>
        </div>
        <div class="footer"></div>
    </div>
</body>
</html>
